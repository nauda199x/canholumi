name: snapshot-data
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/snapshot.yml']
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data
          curl -sSfL "https://lumihanoi.pages.dev/api/listings?ts=$(date +%s)" -o data/listings.json
          python3 -c "import json;d=json.load(open('data/listings.json'));print(d.keys(), len(d['listings']))"
          git config user.name "canholumi-bot"; git config user.email "bot@canholumi.com"
          git add data/listings.json
          git commit -m "data snapshot" || true
          git push
