name: build-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'   # dựng lại trang tĩnh 5 phút/lần; trình duyệt khách tự cập nhật mỗi phút
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build từ bảng hàng
        run: node build.mjs
      - name: Kiểm tra on-page SEO
        run: node audit.mjs
        continue-on-error: true
      - name: Kiểm tra dữ liệu có đổi không
        id: diff
        run: |
          old=$(curl -sf https://canholumi.com/data-hash.txt || true)
          new=$(cat dist/data-hash.txt)
          curl -sf https://canholumi.com/data/urls.txt -o old-urls.txt || : > old-urls.txt
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$old" != "$new" ]; then echo "deploy=1" >> $GITHUB_OUTPUT; else echo "Không đổi, bỏ qua"; fi
      - name: Đẩy lên nhánh gh-pages
        if: steps.diff.outputs.deploy == '1'
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "canholumi-bot"
          git config user.email "bot@canholumi.com"
          git add -A
          git commit -qm "Deploy $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Báo IndexNow (Bing, Yandex…) các URL mới
        if: steps.diff.outputs.deploy == '1'
        continue-on-error: true
        run: |
          sleep 90
          comm -13 <(sort old-urls.txt) <(sort dist/data/urls.txt) > new-urls.txt || true
          [ -s old-urls.txt ] || head -60 dist/data/urls.txt > new-urls.txt
          n=$(wc -l < new-urls.txt); echo "URL mới: $n"
          [ "$n" -gt 0 ] || exit 0
          key=$(cat indexnow.key)
          python3 -c "import json,sys;u=[l.strip() for l in open('new-urls.txt') if l.strip()][:9000];print(json.dumps({'host':'canholumi.com','key':'$key','keyLocation':'https://canholumi.com/$key.txt','urlList':u}))" > payload.json
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -H 'Content-Type: application/json' --data @payload.json https://api.indexnow.org/indexnow
