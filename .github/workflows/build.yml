name: build-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'   # dựng lại trang tĩnh (SEO); trang hiển thị trực tiếp đã tự cập nhật mỗi phút
permissions:
  contents: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build từ bảng hàng
        run: node build.mjs
      - name: Kiểm tra dữ liệu có đổi không
        id: diff
        run: |
          old=$(curl -sf https://canholumi.com/data-hash.txt || true)
          new=$(cat dist/data-hash.txt)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$old" != "$new" ]; then echo "deploy=1" >> $GITHUB_OUTPUT; else echo "Không đổi, bỏ qua"; fi
      - name: Đẩy lên nhánh gh-pages
        if: steps.diff.outputs.deploy == '1'
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "canholumi-bot"
          git config user.email "bot@canholumi.com"
          git add -A
          git commit -qm "Deploy $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
