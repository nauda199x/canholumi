name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; : > probe/out.txt
          for a in 0 O; do for b in l I; do
            id="AKfycby3MH-JDq8BfuGvnbaRmEX${a}9ddytHLgE4EeosHJsL8474NZqGX6a5scJi-HBz_${b}YE1pkQ"
            code=$(curl -s -L -o /tmp/b -w '%{http_code}' -H "Origin: https://canholumi.com" -D /tmp/h "https://script.google.com/macros/s/$id/exec")
            echo "$a$b $code $(grep -i '^access-control-allow-origin' /tmp/h | tail -1 | tr -d '\r') $(head -c 160 /tmp/b | tr '\n' ' ')" >> probe/out.txt
          done; done
          git config user.name bot; git config user.email bot@canholumi.com
          git add probe; git commit -m probe; git push
