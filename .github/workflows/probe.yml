name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe
          sleep 60
          { curl -s https://canholumi.com/ | grep -o 'window.LIVE_URL="[^"]*"' | head -c 60; echo;
            curl -sL "$(cat live-endpoint.txt)" | python3 -c "import json,sys;d=json.load(sys.stdin);L=d['listings'];print('ok',d['ok'],len(L),'keys',sorted(set(k for x in L for k in x)));print('bytes',len(json.dumps(d)))"; } > probe/out.txt 2>&1
          git config user.name bot; git config user.email bot@canholumi.com
          git rm -q .github/workflows/probe.yml; git add probe; git commit -m probe-result; git push
