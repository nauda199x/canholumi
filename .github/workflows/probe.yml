name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install -q gdown pillow
          mkdir -p raw && cd raw
          gdown --folder "https://drive.google.com/drive/folders/1BX4lPtK6OkaeGIb_h5r-q8Kvpp1QO4ux" -O . --remaining-ok 2>&1 | tail -30 > ../gd.log || true
          cd ..
          mkdir -p photos-src
          python3 - <<'PY'
          import os
          from PIL import Image, ImageOps
          out=[]
          for root,_,fs in os.walk('raw'):
              for f in sorted(fs):
                  p=os.path.join(root,f)
                  try:
                      im=ImageOps.exif_transpose(Image.open(p)).convert('RGB')
                  except Exception as e:
                      out.append(f'SKIP {p} {e}'); continue
                  w,h=im.size
                  im.thumbnail((2000,2000))
                  name=f'{len(out):03d}.jpg'
                  im.save('photos-src/'+name,quality=84,optimize=True,progressive=True)
                  out.append(f'{name} <- {os.path.relpath(p,"raw")} {w}x{h}')
          open('photos-src/INDEX.txt','w').write('\n'.join(out)+'\n')
          PY
          cat gd.log >> photos-src/INDEX.txt
          git config user.name bot; git config user.email bot@canholumi.com
          git rm -q .github/workflows/probe.yml
          git checkout -b photos-src
          git add photos-src; git commit -qm "photos from drive"; git push -f origin photos-src
